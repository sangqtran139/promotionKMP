#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#SDK
# Nguồn version TẬP TRUNG cho toàn SDK: :promotionLogic (KMP) + :AndroidPromotionSDK đọc property này
# để đặt toạ độ Maven $SDK_GROUP:*:<SDK_VERSION>. Override khi build:
# `-PSDK_VERSION=x.y.z` hoặc `./scripts/build-android.sh --version x.y.z`.
# iOS đồng bộ TAY ở PromotionSDKUI.xcodeproj (MARKETING_VERSION) — giữ trùng số với đây.
SDK_VERSION=1.0.0

# groupId TẬP TRUNG. Đọc bởi cả 4 chỗ: hai module SDK (đặt `group`), settings.gradle.kts (giới hạn
# repo theo đúng group này) và :androidApp (dòng `implementation`).
# ĐỔI GIÁ TRỊ NÀY LÀ BREAKING với mọi host đang khai toạ độ cũ — phải bump major + báo đối tác.
SDK_GROUP=com.ttcn.promotion

#Artifactory (JFrog) — repo phát hành nội bộ, xem docs/android/Distribution.md §3.4
# KHÔNG điền credentials vào file này (nó được commit). Đặt ở ~/.gradle/gradle.properties:
#     artifactoryUrl=https://<host>/artifactory
#     artifactoryUser=<user>
#     artifactoryPassword=<identity token / API key>
# Hoặc biến môi trường trên CI: ARTIFACTORY_URL / ARTIFACTORY_USER / ARTIFACTORY_PASSWORD.
# Thiếu artifactoryUrl thì repo remote không được đăng ký — build và publishToMavenLocal vẫn chạy
# bình thường. Hai key dưới chỉ cần khai khi Artifactory đặt tên repo khác mặc định:
#artifactoryReleasesRepo=libs-release-local
#artifactorySnapshotsRepo=libs-snapshot-local