#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#SDK
# Nguồn version TẬP TRUNG cho toàn SDK: :promotionLogic (KMP) + :AndroidPromotionUI đọc property này
# để đặt toạ độ Maven com.ttcn.promotion:*:<SDK_VERSION>. Override khi build:
# `-PSDK_VERSION=x.y.z` hoặc `./scripts/build-android.sh --version x.y.z`.
# iOS đồng bộ TAY ở PromotionSDKUI.xcodeproj (MARKETING_VERSION) — giữ trùng số với đây.
SDK_VERSION=1.0.0