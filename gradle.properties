#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#SDK
# MỘT version cho cả SDK — đối xứng iOS (`MARKETING_VERSION`, một số cho cả gói).
#
#   SDK_VERSION → $SDK_GROUP:promotion       (:AndroidPromotionSDK — toạ độ host khai)
#              → $SDK_GROUP:promotionLogic   (:promotionLogic, lõi KMP)
#
# Vẫn là HAI artifact Maven, chỉ dùng chung một số. Trước đây tách `LOGIC_VERSION` riêng để "sửa UI
# khỏi bump lõi", nhưng thực tế không tách được: `:AndroidPromotionSDK` khai
# `implementation(projects.promotionLogic)` nên Gradle ghi version lõi vào POM + `module.json` của
# `promotion` — bump bên nào cũng **phải publish lại cả hai**, không thì host resolve ra bản lệch.
# Hai số chỉ tạo thêm một trạng thái sai để nhớ, không mua được gì.
#
# KHÔNG phải khai tay chỗ nối — Gradle tự ghi, xem `docs/android/Distribution.md` §3.1.
#
# Override khi build: `-PSDK_VERSION=x.y.z`, hoặc `./scripts/build-android.sh --version x.y.z`.
# Hậu tố `-SNAPSHOT` quyết định repo Artifactory (release hay snapshot) cho cả hai module.
#
# iOS đồng bộ TAY ở PromotionKit.xcodeproj (MARKETING_VERSION) — giữ trùng với SDK_VERSION.
SDK_VERSION=1.0.0

# groupId TẬP TRUNG. Đọc bởi cả 4 chỗ: hai module SDK (đặt `group`), settings.gradle.kts (giới hạn
# repo theo đúng group này) và :androidApp (dòng `implementation`).
# ĐỔI GIÁ TRỊ NÀY LÀ BREAKING với mọi host đang khai toạ độ cũ — phải bump major + báo đối tác.
#
# Group DUY NHẤT: mọi đích phát hành (~/.m2, Artifactory chung, Artifactory Viettelmoney) đều nhận
# cùng một bộ toạ độ `vn.viettelpay.library:promotion` + `:promotionLogic` — đúng group đối tác
# Viettelmoney đang khai. Trước đây có thêm bộ `com.ttcn.promotion:promotionSDK` đẩy song song, kèm
# hai POM viết tay ở `<module>/publishing/pom.xml`; bỏ rồi vì POM tay không có cách nào đúng mãi, nó
# lệch dependency graph thật lúc nào không ai biết (đã từng thiếu SẠCH dependency ở `promotion`, và
# thiếu multiplatform-settings ở `promotion-logic`). Nay POM + Gradle Module Metadata đều do Gradle
# sinh từ `from(components[...])`.
#
# LƯU Ý artifactId của lõi là `promotionLogic`, KHÔNG phải `promotion-logic` như bản cũ: Gradle ghi
# toạ độ dependency theo TÊN MODULE, đổi tên ở publication không đổi được nó (xem
# promotionLogic/build.gradle.kts). Host không gõ tên này — nó về theo metadata của `promotion`.
SDK_GROUP=vn.viettelpay.library

# Nguồn SDK của app demo `:androidApp` — MỘT field boolean:
#
#   true    ~/.m2                      ← vòng lặp dev: sửa SDK → publish ~/.m2 → chạy app ngay
#   false   Artifactory Viettelmoney   ← nghiệm thu ĐÚNG artifact đối tác sẽ nhận
#
# `settings.gradle.kts` đọc field này rồi đăng ký đúng MỘT repo cho $SDK_GROUP — cố ý không xếp
# chồng hai repo, vì repo đứng trước sẽ lặng lẽ che repo sau (bản ~/.m2 cũ vẫn build xanh trong khi
# tưởng đang test bản trên server). Thà báo `Could not find` còn hơn đúng nhầm.
#
# `true` thì **phải publish vào ~/.m2 trước khi build app** — `./scripts/build-android.sh local` ép sẵn
# thứ tự đó. `false` thì cần `maven.username` / `maven.password` trong local.properties.
#
# Chỉ nhận đúng `true` / `false`; gõ giá trị khác thì build dừng ngay với thông báo rõ, chứ không
# lặng lẽ hiểu thành `false`. Đổi tạm cho một lần chạy: `-PuseMavenLocal=false`.
useMavenLocal=true

#Artifactory (JFrog) — repo phát hành nội bộ, xem docs/android/Distribution.md §3.4
# KHÔNG điền credentials vào file này (nó được commit). Đặt ở ~/.gradle/gradle.properties:
#     artifactoryUrl=https://<host>/artifactory
#     artifactoryUser=<user>
#     artifactoryPassword=<identity token / API key>
# Hoặc biến môi trường trên CI: ARTIFACTORY_URL / ARTIFACTORY_USER / ARTIFACTORY_PASSWORD.
# Thiếu artifactoryUrl thì repo remote không được đăng ký — build và publishToMavenLocal vẫn chạy
# bình thường. Hai key dưới chỉ cần khai khi Artifactory đặt tên repo khác mặc định:
#artifactoryReleasesRepo=libs-release-local
#artifactorySnapshotsRepo=libs-snapshot-local