#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#SDK
# HAI version ĐỘC LẬP, mỗi module một dòng — sửa tầng UI không phải bump lõi và ngược lại.
#
#   SDK_VERSION   → $SDK_GROUP:promotion    (:AndroidPromotionSDK — toạ độ host khai)
#   LOGIC_VERSION → $SDK_GROUP:promotionLogic  (:promotionLogic, lõi KMP)
#
# KHÔNG phải khai tay chỗ nối: `:AndroidPromotionSDK` khai `implementation(projects.promotionLogic)`,
# Gradle tự ghi LOGIC_VERSION vào POM + `module.json` của promotion. Bump lõi thì **phải publish
# lại cả hai** — bản promotion cũ vẫn trỏ LOGIC_VERSION cũ, host không tự nhảy sang bản mới.
#
# Override khi build: `-PSDK_VERSION=x.y.z -PLOGIC_VERSION=a.b.c`, hoặc
# `./scripts/build-android.sh --version x.y.z --logic-version a.b.c`.
# Hậu tố `-SNAPSHOT` quyết định repo Artifactory (release hay snapshot) RIÊNG cho từng module.
#
# iOS đồng bộ TAY ở PromotionSDKUI.xcodeproj (MARKETING_VERSION) — giữ trùng với SDK_VERSION.
SDK_VERSION=9.9.9
LOGIC_VERSION=9.9.9

# groupId TẬP TRUNG. Đọc bởi cả 4 chỗ: hai module SDK (đặt `group`), settings.gradle.kts (giới hạn
# repo theo đúng group này) và :androidApp (dòng `implementation`).
# ĐỔI GIÁ TRỊ NÀY LÀ BREAKING với mọi host đang khai toạ độ cũ — phải bump major + báo đối tác.
#
# Group DUY NHẤT: mọi đích phát hành (~/.m2, Artifactory chung, Artifactory Viettelmoney) đều nhận
# cùng một bộ toạ độ `vn.viettelpay.library:promotion` + `:promotionLogic` — đúng group đối tác
# Viettelmoney đang khai. Trước đây có thêm bộ `com.ttcn.promotion:promotionSDK` đẩy song song, kèm
# hai POM viết tay ở `<module>/publishing/pom.xml`; bỏ rồi vì POM tay không có cách nào đúng mãi, nó
# lệch dependency graph thật lúc nào không ai biết (đã từng thiếu SẠCH dependency ở `promotion`, và
# thiếu multiplatform-settings ở `promotion-logic`). Nay POM + Gradle Module Metadata đều do Gradle
# sinh từ `from(components[...])`.
#
# LƯU Ý artifactId của lõi là `promotionLogic`, KHÔNG phải `promotion-logic` như bản cũ: Gradle ghi
# toạ độ dependency theo TÊN MODULE, đổi tên ở publication không đổi được nó (xem
# promotionLogic/build.gradle.kts). Host không gõ tên này — nó về theo metadata của `promotion`.
SDK_GROUP=vn.viettelpay.library

# Nguồn SDK cho :androidApp — TUỲ CHỌN, mặc định TẮT.
#
# Bật thì thứ tự hỏi repo là:  ~/.m2  →  Artifactory Viettelmoney  →  google()/mavenCentral()
# `~/.m2` đứng đầu nên thắng, nhưng KHÔNG tìm thấy thì Gradle tự đi tiếp xuống server — publish mỗi
# một module vào ~/.m2 vẫn build được, module còn lại về từ Artifactory.
#
# Tắt (mặc định) thì ~/.m2 không được đăng ký, app luôn lấy đúng thứ host thật lấy — bản local cũ
# không thể âm thầm che bản trên server.
#
# Bỏ dấu # để bật lâu dài cho máy này, hoặc bật từng lần bằng `-PuseMavenLocal=true`.
# `./scripts/build-android.sh` tự truyền cờ sau khi publish nên không cần khai gì.
useMavenLocal=false

#Artifactory (JFrog) — repo phát hành nội bộ, xem docs/android/Distribution.md §3.4
# KHÔNG điền credentials vào file này (nó được commit). Đặt ở ~/.gradle/gradle.properties:
#     artifactoryUrl=https://<host>/artifactory
#     artifactoryUser=<user>
#     artifactoryPassword=<identity token / API key>
# Hoặc biến môi trường trên CI: ARTIFACTORY_URL / ARTIFACTORY_USER / ARTIFACTORY_PASSWORD.
# Thiếu artifactoryUrl thì repo remote không được đăng ký — build và publishToMavenLocal vẫn chạy
# bình thường. Hai key dưới chỉ cần khai khi Artifactory đặt tên repo khác mặc định:
#artifactoryReleasesRepo=libs-release-local
#artifactorySnapshotsRepo=libs-snapshot-local